<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --bg-color: #050505;
            --surface: #121212;
            --border: #2a2a2a;
            --text-main: #ededed;
            --text-muted: #888888;
            --success: #10b981;
            --danger: #ef4444;
            --font-mono: 'Consolas', 'Courier New', monospace;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-mono);
            width: 400px;
            margin: 0;
            padding: 1rem;
            font-size: 14px;
        }
        h3 {
            margin-top: 0;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
            text-transform: uppercase;
            font-size: 1rem;
        }
        .server-item {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 0.8rem;
            margin-bottom: 0.5rem;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .details {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }
        .name { font-weight: bold; }
        .port { color: var(--text-muted); font-size: 12px; }
        .status { font-size: 12px; font-weight: bold; }
        .running { color: var(--success); }
        .stopped { color: var(--danger); }
        button {
            background: var(--surface);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 0.4rem 0.8rem;
            font-family: var(--font-mono);
            cursor: pointer;
            border-radius: 4px;
            text-transform: uppercase;
        }
        button:hover { background: var(--border); }
        .error { color: var(--danger); font-size: 12px; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <h3>Orchestrator Control</h3>
    <div id="errorMsg" class="error"></div>
    <div id="serverList">Initializing state...</div>
    <script src="popup.js"></script>
</body>
</html>
